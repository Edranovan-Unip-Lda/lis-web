server {
  listen 80;
  sendfile on;
  default_type application/octet-stream;

  gzip on;
    gzip_proxied any;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;


  root /usr/share/nginx/html;

  # ngx-extended-pdf-viewer ships its pdf.js worker/viewer as ES modules (.mjs) and WebAssembly (.wasm)
  # under /assets/. nginx's bundled mime.types doesn't map these, so they fall back to the
  # default_type (application/octet-stream) and the browser refuses to load them as module scripts
  # ("Failed to load module script ... MIME type of application/octet-stream"). Force the correct types.
  location ~* \.mjs$ {
    default_type text/javascript;
  }
  location ~* \.wasm$ {
    default_type application/wasm;
  }

  location / {
    try_files $uri $uri/ /index.html =404;
  }
}
