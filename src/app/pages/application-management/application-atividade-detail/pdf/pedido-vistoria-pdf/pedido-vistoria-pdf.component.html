<div class="card">
    <div class="grid grid-cols-12 mb-4">
        <div class="col-span-8">
            <span class="text-2xl font-bold mr-4">{{ 'application.pdf.pedidoVistoria.title' | translate }}</span>
        </div>
        <div class="col-span-4 flex justify-end mb-4">
            <p-button (click)="goBack()" icon="pi pi-chevron-circle-left" [label]="'common.back' | translate" severity="help" size="large"
                [text]="true" [rounded]="true" [raised]="true" />
        </div>
    </div>

    @if (loading()) {
    <div class="flex justify-center py-16">
        <p-progress-spinner [ariaLabel]="'application.pdf.loadingForm' | translate" />
    </div>
    } @else if (errorMsg()) {
    <div class="flex justify-center py-16 text-lg text-red-600">{{ errorMsg()! | translate }}</div>
    } @else {
    <app-pdf-viewer [src]="pdfSrc()" [filename]="filename()" />
    }
</div>
<p-toast position="bottom-right" key="br" />
