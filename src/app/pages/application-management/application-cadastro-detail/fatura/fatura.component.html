<div class="card">
    <div class="grid grid-cols-12 mb-4">
        <div class="col-span-8">
            @switch (type) {
            @case ('CADASTRO') {
            <span class="text-2xl font-bold mr-4">Fatura do Pedido de Inscrição no Cadastro</span>
            }
            @case ('ATIVIDADE') {
            <span class="text-2xl font-bold mr-4">Fatura do Pedido de Licença para Exercício de Atividade</span>
            }
            @case ('VISTORIA') {
            <span class="text-2xl font-bold mr-4">Fatura do Pedido de Vistoria</span>
            }
            }
        </div>
        <div class="col-span-4 flex justify-end mb-4">
            <p-button (click)="goBack()" icon="pi pi-chevron-circle-left" label="Voltar" severity="help" size="large"
                [text]="true" [rounded]="true" [raised]="true" />
        </div>
    </div>

    @if (loading()) {
    <div class="flex justify-center py-16">
        <p-progress-spinner ariaLabel="A carregar fatura" />
    </div>
    } @else if (errorMsg()) {
    <div class="flex justify-center py-16 text-lg text-red-600">{{ errorMsg() }}</div>
    } @else {
    <app-pdf-viewer [src]="pdfSrc()" [filename]="filename()" />
    }
</div>
<p-toast position="bottom-right" key="br" />
