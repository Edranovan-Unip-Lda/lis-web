 <p-fluid class="min-h-screen text-center flex flex-col items-center justify-center" style="padding: 2rem 1rem;">
     <div class="flex flex-col w-full max-w-md mx-auto">
         <div class="flex items-center justify-center">
             <img src="/images/logo.png" style="width: 100px" alt="logo" />
         </div>
         <p class="text-2xl font-bold mb-4">
             {{ 'auth.common.systemTitleLine1' | translate }} <br> {{ 'auth.common.systemTitleLine2' | translate }}
         </p>
         @if (notification) {
         <p-message [severity]="notification.state">
             <ng-template #icon>
                 <i [class]="notification.icon" style="font-size: 2.5rem"></i> &nbsp;
             </ng-template>
             <span class="ml-2 text-lg text-left">
                 {{ notification.message || (notification.messageKey | translate) }}
             </span>
         </p-message>
         }
         <div class="mt-6 text-center flex items-center justify-center">
             <button routerLink="/auth/login" icon="pi pi-sign-in" pButton [label]="'auth.common.enter' | translate"
                 style="max-width: 200px"></button>
         </div>

     </div>
 </p-fluid>
