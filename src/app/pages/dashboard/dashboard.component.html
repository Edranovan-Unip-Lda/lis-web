 <div class="col-span-12 mb-4">
     <div class="grid grid-cols-3">
         <div class="col-span-3 lg:col-span-1">
             <label for="yearFilter" class="text-md font-semibold text-gray-50">
                 {{ 'dashboard.yearFilter' | translate }}
             </label>
             <p-select (ngModelChange)="yearChange($event)" inputId="yearFilter" [(ngModel)]="yearCtrl"
                 [options]="visitorYear" optionLabel="name" [fluid]="true" [showClear]="true"
                 [placeholder]="'dashboard.selectYear' | translate" styleClass="w-32">
             </p-select>
         </div>
     </div>
 </div>

 <div class="grid grid-cols-12 gap-8">
     <stats-widget [kpisData]="kpisData" [receita]="receita" />

     <div class="col-span-12">
         <app-empresa-map [data]="empresasByMunicipio" (municipioSelected)="onMunicipioSelected($event)">
         </app-empresa-map>
     </div>

     <div class="col-span-12 xl:col-span-6">
         <app-certificado-licenca-municipio-pie [title]="'dashboard.titles.empresaSociedade' | translate"
             [data]="empresasBySociedadeComercial" [chartType]="'sociedade'"
             [attr.data-chart-id]="'sociedade-comercial'" />
     </div>

     <div class="col-span-12 xl:col-span-6">
         <app-certificado-licenca-municipio-pie [title]="'dashboard.titles.empresaTipo' | translate" [data]="empresasByTipoEmpresa"
             [chartType]="'tipo'" [attr.data-chart-id]="'tipo-empresa'" />
     </div>

     <!-- Receita (Tax Income) — separate charts for Comercial and Industrial -->
     @if (receita) {
     <div class="col-span-12 md:col-span-6 mb-8">
         <app-receita-mensal-charts [receita]="receita" categoria="COMERCIAL" />
     </div>
     <div class="col-span-12 md:col-span-6 mb-8">
         <app-receita-mensal-charts [receita]="receita" categoria="INDUSTRIAL" />
     </div>
     }

     <!-- Certificado de Inscrição -->
     <div class="col-span-12 mb-2">
         <h2 class="text-xl font-semibold pb-2 border-b-2 border-blue-500">
             {{ 'dashboard.titles.certificados' | translate }}
         </h2>
     </div>

     <div class="col-span-12 xl:col-span-8">
         <app-certificado-licenca-categoria-charts [title]="'dashboard.titles.certificadosPorMes' | translate"
             [licensesPerMonth]="certificatesPerMonth" />
     </div>

     <div class="col-span-12 xl:col-span-4">
         <app-certificado-licenca-municipio-pie [title]="'dashboard.titles.certificadosEstado' | translate"
             [data]="certificatesStatusPerMonth" />
     </div>

     <div class="col-span-12 mb-8">
         <app-certificado-licenca-estado [title]="'dashboard.titles.certificadosMunicipio' | translate"
             [data]="certificatesByMunicipio" />
     </div>

     <!-- Alvará de Licenças -->
     <div class="col-span-12 mb-2">
         <h2 class="text-xl font-semibold pb-2 border-b-2 border-green-500">
             {{ 'dashboard.titles.alvaras' | translate }}
         </h2>
     </div>

     <div class="col-span-12 xl:col-span-8">
         <app-certificado-licenca-categoria-charts [title]="'dashboard.titles.alvarasPorMes' | translate"
             [licensesPerMonth]="licensesPerMonth" />
     </div>

     <div class="col-span-12 xl:col-span-4">
         <app-certificado-licenca-municipio-pie [title]="'dashboard.titles.alvarasEstado' | translate"
             [data]="licensesStatusPerMonth" />
     </div>

     <div class="col-span-12">
         <app-certificado-licenca-estado [title]="'dashboard.titles.alvarasMunicipio' | translate"
             [data]="licensesByMunicipio" />
     </div>
 </div>
