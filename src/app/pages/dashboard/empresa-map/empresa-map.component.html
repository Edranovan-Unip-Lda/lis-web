<div class="card widget-visitor-graph">
	<div class="card-header leading-loose">
		<span class="text-xl">
			{{title}}
		</span>
	</div>

	<div class="graph">
		@if (chartOptions) {
			<highcharts-chart constructorType="mapChart" [options]="chartOptions"
				style="width:100%; height: 650px; display:block">
			</highcharts-chart>
		} @else {
			<div class="flex items-center justify-center text-gray-400" style="height: 650px;">
				A carregar o mapa…
			</div>
		}
	</div>
</div>
