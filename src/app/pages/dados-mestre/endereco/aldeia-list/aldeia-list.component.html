<div class="card">
    <p-table #dt [value]="dataList" [loading]="dataIsFetching" responsiveLayout="scroll" [rowHover]="true"
        [globalFilterFields]="['postoAdministrativo.nome', 'nome']">
        <ng-template #caption>
            <div class="flex flex-wrap gap-2 items-center justify-between">
                <p-icon-field class="order-1 sm:order-none">
                    <p-inputicon class="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" [placeholder]="'dadosMestre.common.globalSearch' | translate"
                        class="w-full" />
                </p-icon-field>
                <p-button pButton outlined (click)="openDialogNewData(type)"
                    class="sm:w-auto flex-order-0 sm:flex-order-1" icon="bi bi-plus-lg" [label]="'dadosMestre.common.addNew' | translate">
                </p-button>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th pSortableColumn="nome" class="white-space-nowrap">{{ 'common.name' | translate }}
                    <p-sortIcon field="nome">
                    </p-sortIcon>
                </th>
                <th pSortableColumn="suco.nome" class="white-space-nowrap">
                    {{ 'dadosMestre.fields.suco' | translate }}
                    <p-sortIcon field="suco.nome">
                    </p-sortIcon>
                </th>
                <th class="white-space-nowrap">
                    {{ 'common.actions' | translate }}
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-item let-rowIndex="rowIndex">
            <tr>
                <td>
                    {{ item.nome }}
                </td>
                <td>
                    {{item.suco.nome}}
                </td>
                <td>
                    <p-button icon="pi pi-pencil" class="mr-2" severity="info" [rounded]="true" [outlined]="true"
                        (click)="openDialogEditData(item, rowIndex)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                        (click)="deleteData(item.id)" />
                </td>
            </tr>
        </ng-template>
    </p-table>
    <p-paginator (onPageChange)="onPageChange($event)" [rows]="size" [totalRecords]="totalData"
        [rowsPerPageOptions]="[50, 150, 250]" [showCurrentPageReport]="true" [totalRecords]="totalData"
        [currentPageReportTemplate]="'dadosMestre.common.pageReport' | translate" />
</div>

@if (showDialog) {
<p-dialog #dg [header]="('dadosMestre.dialog.' + (isNew ? 'new.' : 'edit.') + type) | translate" [modal]="true" [position]="'top'"
    [(visible)]="showDialog" [style]="{ 'min-width': '30rem' }">
    <form [formGroup]="form">
        <div class="grid grid-cols-12 gap-4">
            <div class="mb-6 col-span-12">
                <div class="mb-6 col-span-12">
                    <label for="municipio" class="font-medium mb-2 block">
                        {{ 'dadosMestre.fields.municipio' | translate }}
                    </label>
                    <p-select (onChange)="municipioSelectOnChange($event)" [appendTo]="'body'"
                        formControlName="municipio" inputId="municipio" [options]="municipioList" optionLabel="nome"
                        fluid [showClear]="true" [placeholder]="'dadosMestre.placeholders.municipio' | translate">
                    </p-select>
                </div>
                <div class="mb-6 col-span-12">
                    <label for="posto" class="font-medium  mb-2 block">
                        {{ 'dadosMestre.fields.posto' | translate }}
                    </label>
                    <p-select (onChange)="postoSelectOnChange($event)" [appendTo]="'body'"
                        formControlName="postoAdministrativo" inputId="posto" [options]="postoList" optionLabel="nome"
                        fluid [showClear]="true" [placeholder]="'dadosMestre.placeholders.posto' | translate">
                    </p-select>
                </div>
                <div class="mb-6 col-span-12">
                    <label for="suco" class="font-medium  mb-2 block">
                        {{ 'dadosMestre.fields.suco' | translate }}
                    </label>
                    <p-select [appendTo]="'body'" formControlName="suco" inputId="suco" [options]="sucoList"
                        optionLabel="nome" fluid [showClear]="true" [placeholder]="'dadosMestre.placeholders.suco' | translate">
                    </p-select>
                </div>
                <label for="nome" class="font-medium  mb-2 block">
                    {{ 'common.name' | translate }}
                </label>
                <input formControlName="nome" id="nome" type="text" pInputText fluid />
            </div>
            <div class="mb-6 col-span-12">
                <p-button class="mr-4" icon="pi pi-times" [label]="'common.cancel' | translate" variant="outlined" severity="danger"
                    (click)="closeDialog()" />
                @if (isNew) {
                <p-button icon="pi pi-save" [loading]="loading" [disabled]="!form.valid" pButton pRipple
                    (click)="saveData(form)" [label]="'common.save' | translate" class="w-auto mt-3"></p-button>
                }@else {
                <p-button icon="pi pi-sync" [loading]="loading" [disabled]="!form.valid" pButton pRipple
                    (click)="updateData(form)" [label]="'dadosMestre.common.update' | translate" class="w-auto mt-3"></p-button>
                }
            </div>

        </div>
    </form>
</p-dialog>
}

<p-toast position="bottom-right" />
<p-confirmdialog />
