# Single-origin parity: serve the SPA and proxy the API from the same host, like prod (lic.mci.gov.tl).
# The trailing slash on proxy_pass strips the /api/ prefix, so the browser's /api/api/v1/... reaches the
# backend as /api/v1/... and /api/data/... reaches it as /data/... (Spring Data REST master data).
server {
    listen 80;
    server_name _;

    # allow large document/recibo uploads (backend caps multipart at 120MB)
    client_max_body_size 130m;

    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;   # Angular client-side routing
    }
}
